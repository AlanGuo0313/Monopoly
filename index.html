<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121b30"><title>東京大亨 Tokyo Afterglow · 3D 大富翁</title><link rel="stylesheet" href="style.css"></head><body data-night="true">
